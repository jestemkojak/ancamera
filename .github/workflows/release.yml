name: Release APK

# Push a tag such as v0.1.0 to build a signed APK and publish a GitHub release.
# The tag must match versionName in app/build.gradle.kts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANCAMERA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          ANCAMERA_KEYSTORE: ${{ runner.temp }}/release.jks
          ANCAMERA_KEYSTORE_PASSWORD: ${{ secrets.ANCAMERA_KEYSTORE_PASSWORD }}
          ANCAMERA_KEY_ALIAS: ${{ secrets.ANCAMERA_KEY_ALIAS }}
          ANCAMERA_KEY_PASSWORD: ${{ secrets.ANCAMERA_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="ancamera-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
